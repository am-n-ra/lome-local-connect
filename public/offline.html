<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e67835" />
    <title>OmniView — Connexion nécessaire</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fbfaf7; color: #342c26; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom)); }
      main { width: min(100%, 28rem); border: 1px solid #eadfd3; border-radius: 1.5rem; background: rgba(255,255,255,.8); padding: 2rem; box-shadow: 0 12px 32px -18px rgba(90,50,25,.45); text-align: center; }
      .mark { width: 3rem; height: 3rem; margin: 0 auto 1rem; display: grid; place-items: center; border-radius: 1rem; background: #e67835; color: white; font-weight: 800; }
      h1 { margin: 0; font-size: 1.6rem; } p { color: #73665d; line-height: 1.6; } button { border: 0; border-radius: 999px; padding: .8rem 1.1rem; background: #e67835; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">O</div>
      <h1>Omni reviendra dès que le réseau revient.</h1>
      <p>Les actions de disponibilité, de chat, de balance, de paiement, de QR et de transaction ne sont jamais présentées comme confirmées hors connexion.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
