<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Omni · Species V2b - Entrée & guide</title>
<style>
/* ============================================================
   SPECIES V2b - « Entrée & guide »
   Extension ACCEPTÉE de Species V2 (74 écrans). Elle n'invente
   AUCUN token : les variables, la grammaire de feuille, la table
   d'icônes et les atomes viennent de `omni-species-v2-interactive.html`.
   Monochrome. L'accent `--accent` reste RÉSERVÉ à la confiance.
   ============================================================ */
:root{
  --ink:#0f0f0f; --ink-soft:#6b6b6b; --ink-faint:#d8d8d8; --line:#e6e6e6;
  --panel:#f7f7f7; --white:#fff; --accent:#2e8b6f; --accent-soft:#eef4f1;
  --pill:#111; --warn:#8a6d1f; --warn-soft:#f6f0df;
  --sh-sm:0 1px 2px rgba(15,15,15,.04),0 1px 1px rgba(15,15,15,.03);
  --sh-md:0 6px 18px rgba(15,15,15,.08);
  --sh-lg:0 20px 48px rgba(15,15,15,.16); --safe-bottom:14px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f0;color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
.mapbase{position:absolute;inset:0;background:radial-gradient(circle at 32% 28%, #fdfdfc 0%, #f4f4f2 55%, #ececea 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,15,15,.035) 1px,transparent 1px),
   linear-gradient(90deg,rgba(15,15,15,.035) 1px,transparent 1px);background-size:32px 32px}

/* ---------- feuille (grammaire Species V2, inchangée) ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:24px 24px 0 0;
  border-top:1px solid var(--line);box-shadow:0 -14px 44px rgba(15,15,15,.14);padding:9px 14px 92px;
  max-height:88%;overflow:auto;animation:sheetIn .3s cubic-bezier(.23,1,.32,1)}
@keyframes sheetIn{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
.sheet::-webkit-scrollbar{display:none}
.handle{width:38px;height:4px;border-radius:4px;background:var(--ink-faint);margin:0 auto 9px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.eyebrow{font-size:8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-soft)}
h1{font-size:16px;font-weight:800;letter-spacing:-.2px;margin:2px 0 0}
.lead{font-size:11px;color:var(--ink-soft);line-height:1.5;margin:8px 0 0}
.cardbox{padding:11px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:9px;box-shadow:var(--sh-sm)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.btn{display:block;width:100%;height:42px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);
  color:#fff;font-size:12.5px;font-weight:800;margin-top:9px}
.btn.ghost{background:#fff;color:var(--ink)}
.linkbtn{font-size:10px;font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
.status{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.status.ok{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft)}
.status.gray{color:var(--ink-soft)}
.status.dash{color:var(--ink-soft);border-style:dashed}
.status.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-soft)}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:9px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stepline{display:flex;gap:4px;margin-top:10px}
.stepline i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.stepline i.on{background:var(--ink)}
.steplabels{display:flex;justify-content:space-between;font-size:7.5px;font-weight:700;color:var(--ink-soft);
  letter-spacing:.2px;margin-top:5px;text-transform:uppercase}
.big{font-size:26px;font-weight:800;letter-spacing:-.6px}
.timer{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--warn);
  background:var(--warn-soft);border-radius:999px;padding:4px 9px;margin-top:7px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon-in{display:inline-grid;place-items:center}

/* ============================================================
   NOUVEAU - la direction visuelle de l'entrée.
   Trois atomes seulement, tous bâtis sur les tokens existants.
   ============================================================ */

/* Le héros : une promesse, pas un paragraphe. */
.hero{padding:14px 2px 2px}
.hero .kicker{font-size:8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-soft)}
.hero h2{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1.15;margin:7px 0 0}
.hero .sub{font-size:11.5px;color:var(--ink-soft);line-height:1.55;margin:9px 0 0}

/* Le moment : icône ronde + titre + une phrase. Remplace la liste `kv`. */
.moment{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.moment:last-child{border-bottom:0}
.moment .m-ic{flex:none;width:34px;height:34px;border-radius:12px;background:var(--panel);
  display:grid;place-items:center;color:var(--ink)}
.moment .m-body{min-width:0}
.moment .m-n{font-size:8px;font-weight:800;letter-spacing:.8px;color:var(--ink-soft)}
.moment .m-t{font-size:12.5px;font-weight:800;margin-top:1px}
.moment .m-d{font-size:10.5px;color:var(--ink-soft);line-height:1.45;margin-top:3px}

/* L'échelle 0→4 : un vrai curseur, pas des lignes de texte. */
.scale{margin-top:10px}
.scale .bars{display:flex;gap:5px}
.scale .bars i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.scale .bars i.on{background:var(--ink)}
.scale .bars i.top{background:var(--ink)}
.scale .cap{display:flex;justify-content:space-between;margin-top:6px;font-size:7.5px;font-weight:700;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.2px}
.scale .now{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.scale .now b{font-size:19px;font-weight:800}
.scale .now span{font-size:11px;color:var(--ink-soft)}
/* Les 5 niveaux : sélectionnables. Le curseur au-dessus situe, la liste enseigne. */
.lvl{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lvl:last-child{border-bottom:0}
.lvl .l-n{flex:none;width:18px;height:18px;border-radius:6px;background:var(--panel);color:var(--ink-soft);
  display:grid;place-items:center;font-size:9px;font-weight:800}
.lvl.on .l-n{background:var(--ink);color:#fff}
.lvl.on .l-t{font-weight:800}
.lvl .l-t{font-size:10.5px;font-weight:700}
.lvl .l-d{font-size:9.5px;color:var(--ink-soft);line-height:1.4;margin-top:1px}

/* La condition : ce que l'automate fait, et quand il se TAIT. */
.cond{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.cond:last-child{border-bottom:0}
.cond .c-ic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.cond .c-ic.yes{background:var(--accent-soft);color:var(--accent)}
.cond .c-ic.no{background:var(--warn-soft);color:var(--warn)}
.cond .c-t{font-size:11px;font-weight:800}
.cond .c-d{font-size:10px;color:var(--ink-soft);line-height:1.45;margin-top:2px}

/* Le silence : ce qu'Omni ne dira jamais. Encadré distinct, jamais noyé. */
.silence{border:1px dashed var(--ink-faint);border-radius:14px;padding:11px;margin-top:9px;background:var(--panel)}
.silence .s-t{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.silence .s-v{font-size:11.5px;font-weight:800;margin-top:5px}
.silence .s-d{font-size:10px;color:var(--ink-soft);line-height:1.45;margin-top:4px}

/* Les arrêts du guide carte : numérotés, sur une ligne de temps. */
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.stop .s-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:800}
.stop .s-t{font-size:11.5px;font-weight:800}
.stop .s-d{font-size:10px;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.rail-line{position:absolute;left:21px;top:0;bottom:0;width:1px;background:var(--line)}
.stops{position:relative}
</style>
</head>
<body>
<div class="stage">
  <div class="mapbase"></div>
  <div class="grid"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" style="position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
       background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:8px 13px;border-radius:999px;
       opacity:0;transition:opacity .2s;pointer-events:none"></div>
</div>

<script>
/* Table d'icônes - sous-ensemble de celle de Species V2. CHAQUE svg porte
   width/height : un svg sans taille intrinsèque retombe sur 300x150 (leçon suite 3). */
const ICON = {
  compass: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  qr: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3h-3zM20 20h.01"/></svg>',
  shield: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>',
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bell: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>',
  pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>',
  shop: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/></svg>',
  user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>',
  wallet: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>',
  x: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

const S = { sheet: 'welcome', role: 'buyer' };
const ROLES = { buyer: 'Acheteur', seller: 'Vendeur' };

function go(sheet){ S.sheet = sheet; render(); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(window.__t); window.__t = setTimeout(() => t.style.opacity = '0', 1600);
}

/* Les trois temps du cœur - mots du Seed (S-01/S-06), jamais réinventés. */
const MOMENTS = [
  { ic: ICON.compass, t: 'Découvrir', d: 'Cherchez ce qui existe près de vous. Un lieu connu, même non revendiqué, apparaît sur la carte.' },
  { ic: ICON.search,  t: 'Interroger', d: 'Demandez si ça peut satisfaire votre demande maintenant. La disponibilité n’apparaît qu’une fois confirmée.' },
  { ic: ICON.qr,      t: 'Vérifier & transiger', d: 'Scannez le QR du vendeur : la transaction est tracée et verrouillée. Elle ne s’annule pas, elle se reprend.' },
];

/* L'échelle d'existence 0→4 (S-06) - les mots verrouillés. */
const LEVELS = [
  { n: 0, l: 'Présente', d: 'Omni connaît le lieu. Personne ne le gère encore.' },
  { n: 1, l: 'Revendiquée', d: 'Une entité l’a revendiquée et en répond.' },
  { n: 2, l: 'Offre publiée', d: 'Un produit existe ici, visible par tous.' },
  { n: 3, l: 'Disponibilité vivante', d: 'Le vendeur a confirmé du stock, récemment.' },
  { n: 4, l: 'Transactable', d: 'Il reste du stock alloué : on peut verrouiller la transaction.' },
];

/* L'automate : ce qu'il fait, et QUAND il se tait. C'est la partie que le plan
   actuel ne dit nulle part (NR-11) - et l'abstention est un argument de confiance. */
const AUTO_YES = [
  { t: 'Stock frais', d: 'Le vendeur a mis à jour son stock il y a moins de 4 heures.' },
  { t: 'Offre publiée et Pro actif', d: 'Sans plan Pro, c’est le vendeur qui répond, à la main.' },
];
const AUTO_NO = [
  { t: 'La quantité demandée dépasse le stock', d: 'Omni ne propose jamais une réponse partielle. Il laisse le vendeur trancher.' },
  { t: 'Un prix a été négocié', d: 'Dès qu’un acheteur propose un prix, l’automate se tait : négocier est un acte vendeur.' },
  { t: 'Le stock a plus de 4 heures', d: 'Une donnée périmée n’est jamais transformée en vérité. Le vendeur est interrogé.' },
];

const STOPS = [
  { t: 'Basculez entre Acheteur et Vendeur', d: 'Une seule identité, deux espaces. Omni sert les deux.' },
  { t: 'La carte montre tout le monde', d: 'Commerces, particuliers, ambulants. Filtrez selon ce que vous cherchez.' },
  { t: 'Recherche, scan et menu ne bougent pas', d: 'Les trois gestes d’Omni restent au même endroit, quel que soit l’écran.' },
];

function momentRow(m){
  return `<div class="moment">
    <div class="m-ic">${m.ic}</div>
    <div class="m-body"><div class="m-n">TEMPS ${MOMENTS.indexOf(m) + 1}</div>
      <div class="m-t">${m.t}</div><div class="m-d">${m.d}</div></div></div>`;
}
function condRow(c, yes){
  return `<div class="cond">
    <div class="c-ic ${yes ? 'yes' : 'no'}">${yes ? ICON.shield : ICON.clock}</div>
    <div><div class="c-t">${c.t}</div><div class="c-d">${c.d}</div></div></div>`;
}

const SHEETS = {};

/* ---------- ÉCRAN 1 - WELCOME ---------- */
SHEETS.welcome = () => `
  <div class="handle"></div>
  <div class="hero">
    <div class="kicker">Bienvenue sur Omni</div>
    <h2>Trouvez ce qui existe<br/>près de vous.</h2>
    <p class="sub">Sachez si c’est disponible <b>maintenant</b>, puis verrouillez la transaction. Omni ne promet rien qu’il ne puisse prouver.</p>
  </div>
  <div class="cardbox">${MOMENTS.map(momentRow).join('')}</div>
  <button class="btn" onclick="toast('Acheteur · la carte s’ouvre')">Je cherche autour de moi</button>
  <button class="btn ghost" onclick="toast('Vendeur · créer ou revendiquer un lieu')">Je vends quelque chose</button>
  <button class="btn ghost" onclick="go('how-it-works')">Comment ça marche</button>
  <p class="lead" style="text-align:center">Rien n’est imposé. La carte reste ouverte, même sans compte.</p>`;

/* ---------- ÉCRAN 2 - COMMENT ÇA MARCHE ---------- */
SHEETS['how-it-works'] = () => `
  <div class="handle"></div>
  <div class="sheet-head">
    <div><div class="eyebrow">Comment ça marche</div><h1>Le cœur d’Omni, en trois temps</h1></div>
    <button class="linkbtn" onclick="go('welcome')" aria-label="Fermer">${ICON.x}</button>
  </div>

  <div class="cardbox">${MOMENTS.map(momentRow).join('')}</div>

  <div class="cardbox">
    <div class="eyebrow">L’échelle d’existence · 0 → 4</div>
    <div class="scale">
      <div class="bars">${LEVELS.map((l) => `<i class="${l.n <= 3 ? 'on' : 'top'}"></i>`).join('')}</div>
      <div class="cap"><span>Présente</span><span>Transactable</span></div>
    </div>
    ${LEVELS.map((l) => `<div class="lvl${l.n === 4 ? ' on' : ''}" onclick="go('how-it-works')">
      <div class="l-n">${l.n}</div>
      <div><div class="l-t">${l.l}</div><div class="l-d">${l.d}</div></div></div>`).join('')}
    <p class="lead">Beaucoup de lieux sont au <b>niveau 0</b> : Omni les connaît, personne ne les gère encore. C’est vous qui les rendez transactables.</p>
  </div>

  <div class="silence">
    <div class="s-t">Ce qu’Omni ne dira jamais</div>
    <div class="s-v">Disponibilité · prix · horaires</div>
    <div class="s-d">Tant qu’aucune entité ne gère un lieu, il n’y a rien à interroger. Omni le dit franchement plutôt que d’inventer, puis propose de le revendiquer.</div>
  </div>

  <div class="cardbox">
    <div class="eyebrow">Le vendeur en Pro · la disponibilité automatique</div>
    <p class="lead" style="margin-top:4px">En Pro, Omni peut <b>répondre à la place du vendeur</b> quand son stock est frais. Le vendeur garde la main : il l’active <b>produit par produit</b>.</p>
    ${AUTO_YES.map((c) => condRow(c, true)).join('')}
    ${AUTO_NO.map((c) => condRow(c, false)).join('')}
    <p class="lead">L’automate <b>se tait</b> plutôt que de deviner. C’est ce qui rend sa réponse fiable.</p>
  </div>

  <div class="cardbox">
    <div class="eyebrow">Les notifications</div>
    <div class="kv"><span><span class="icon-in">${ICON.bell}</span> Où elles vivent</span><b>Dans l’Inbox, toujours</b></div>
    <div class="kv"><span>Quand on vous demande la permission</span><b>Après votre première action</b></div>
    <p class="lead">Omni demande la permission <b>après</b> une action qui la rend utile (une demande envoyée, une offre publiée), jamais à l’ouverture. Refuser ne cache rien : l’Inbox garde tout.</p>
  </div>

  <button class="btn" onclick="go('spotlight')">Voir la carte</button>`;

/* ---------- ÉCRAN 3 - SPOTLIGHT CARTE ---------- */
SHEETS.spotlight = () => `
  <div class="handle"></div>
  <div class="sheet-head">
    <div><div class="eyebrow">La carte · en un coup d’œil</div><h1>Trois gestes, et vous êtes opérationnel</h1></div>
    <button class="linkbtn" onclick="go('welcome')" aria-label="Fermer">${ICON.x}</button>
  </div>
  <div class="stops">
    <div class="rail-line"></div>
    ${STOPS.map((s, i) => `<div class="stop">
      <div class="s-n">${i + 1}</div>
      <div><div class="s-t">${s.t}</div><div class="s-d">${s.d}</div></div></div>`).join('')}
  </div>
  <div class="cardbox">
    <div class="kv"><span>Un point plein</span><b class="status ok">Revendiqué · géré</b></div>
    <div class="kv"><span>Un point en pointillés</span><b class="status dash">Personne ne le gère</b></div>
    <div class="kv"><span>Un point ambré</span><b class="status warn">Ambulant · se déplace</b></div>
  </div>
  <button class="btn" onclick="toast('La carte s’ouvre')">Commencer à explorer</button>
  <button class="btn ghost" onclick="go('how-it-works')">Revoir le cœur d’Omni</button>`;

function render(){
  document.getElementById('sheet').innerHTML = SHEETS[S.sheet]();
}
render();
</script>
</body>
</html>
