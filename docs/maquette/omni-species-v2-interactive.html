<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omni — Species V2 (prototype interactif)</title>
<style>
  :root{
    --ink:#0f0f0f; --ink-soft:#6b6b6b; --ink-faint:#d8d8d8; --line:#e6e6e6;
    --panel:#f7f7f7; --white:#fff; --accent:#2e8b6f; --accent-soft:#eef4f1;
    --pill:#111; --warn:#8a6d1f; --warn-soft:#f6f0df;
    --sh-sm:0 1px 2px rgba(15,15,15,.04),0 1px 1px rgba(15,15,15,.03);
    --sh-md:0 6px 18px rgba(15,15,15,.08);
    --sh-lg:0 20px 48px rgba(15,15,15,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f0;color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .stage{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
  .mapbase{position:absolute;inset:0;background:radial-gradient(circle at 32% 28%, #fdfdfc 0%, #f4f4f2 55%, #ececea 100%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(15,15,15,.035) 1px,transparent 1px),
     linear-gradient(90deg,rgba(15,15,15,.035) 1px,transparent 1px);background-size:32px 32px}
  .land{position:absolute;background:#e7e6e2;opacity:.85}
  .land.a{width:280px;height:190px;left:-40px;top:120px;border-radius:44% 56% 38% 62%/50% 40% 60% 50%;transform:rotate(-14deg)}
  .land.b{width:150px;height:110px;right:-20px;bottom:160px;border-radius:50% 50% 45% 55%;transform:rotate(20deg)}
  .countmark{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
     background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--sh-sm);z-index:4}
  .countmark small{display:block;font-size:7px;font-weight:600;letter-spacing:.4px;opacity:.75;margin-top:1px;text-align:center}
  .vdot{position:absolute;z-index:4;width:12px;height:12px;border-radius:50%;background:var(--accent);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
  .vdot.ink{background:var(--ink)}
  .vdot.unclaimed{background:#fff;border:2px dashed var(--ink-soft)}
  .vdot.mobile{background:var(--warn);box-shadow:0 0 0 5px var(--warn-soft)}
  .usermarker{position:absolute;width:15px;height:15px;border-radius:50%;background:#1a73e8;border:2.5px solid #fff;
     box-shadow:0 0 0 1px rgba(0,0,0,.1),var(--sh-sm);z-index:5}
  .rolepill{position:absolute;z-index:20;top:12px;left:50%;transform:translateX(-50%);display:flex;padding:3px;
    border-radius:999px;background:rgba(255,255,255,.92);border:1px solid var(--line);backdrop-filter:blur(10px);
    box-shadow:var(--sh-md);white-space:nowrap}
  .rolepill button{font-size:9.5px;font-weight:700;padding:5px 11px;border-radius:999px;color:var(--ink-soft)}
  .rolepill button.on{background:var(--ink);color:#fff}
  .navpill{position:absolute;z-index:60;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
    gap:2px;padding:6px;border-radius:999px;background:var(--pill);box-shadow:var(--sh-lg)}
  .navpill button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.78)}
  .navpill button.active{color:#fff;background:rgba(255,255,255,.18)}
  .navpill .center{width:46px;height:46px;margin:0 2px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
    display:grid;place-items:center;color:#fff}
  .navpill .center.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
  .navpill svg{width:18px;height:18px}
  .navpill .center svg{width:20px;height:20px}
  .mapctrl{position:absolute;right:12px;top:52px;display:flex;flex-direction:column;gap:6px;z-index:6}
  .mapctrl button{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);
    box-shadow:var(--sh-sm);font-weight:800;font-size:14px;color:var(--ink)}
  .filterrail{position:absolute;left:12px;top:50px;display:flex;gap:6px;z-index:6;flex-wrap:wrap;max-width:220px}
  .fchip{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;font-size:9.5px;font-weight:700;box-shadow:var(--sh-sm);color:var(--ink)}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fchip.soon{color:var(--ink-faint)}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:24px 24px 0 0;
    border-top:1px solid var(--line);box-shadow:0 -14px 44px rgba(15,15,15,.14);padding:9px 14px 92px;
    max-height:78%;overflow:auto;animation:sheetIn .3s cubic-bezier(.23,1,.32,1)}
  @keyframes sheetIn{0%{transform:translateY(18px);opacity:0}100%{transform:none;opacity:1}}
  .sheet::-webkit-scrollbar{display:none}
  .handle{width:38px;height:4px;border-radius:4px;background:var(--ink-faint);margin:0 auto 9px}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .eyebrow{font-size:8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-soft)}
  .sheet h1{font-size:16px;letter-spacing:-.4px;margin:3px 0 0}
  .sheet .lead{font-size:10.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
  .cardbox{padding:11px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:9px;box-shadow:var(--sh-sm)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
  .kv:first-child{border-top:0}.kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--ink-soft)}
  .kv b{font-weight:800;text-align:right}
  .btn{display:block;width:100%;height:42px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);
    color:#fff;font-size:13px;font-weight:800;margin-top:9px}
  .btn.sm{height:36px;font-size:12px}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.ok{background:var(--accent);border-color:var(--accent)}
  .btnrow{display:flex;gap:8px}.btnrow .btn{margin-top:9px}
  .status{font-size:9px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.3px;white-space:nowrap}
  .status.ok{background:var(--accent-soft);color:var(--accent)}
  .status.gray{background:var(--panel);color:var(--ink-soft)}
  .status.dash{background:#fff;border:1px dashed var(--ink-soft);color:var(--ink-soft)}
  .status.warn{background:var(--warn-soft);color:var(--warn)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:9.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.soon{color:var(--ink-faint);border-style:dashed}
  .fld{display:flex;align-items:center;gap:7px;height:38px;border-radius:999px;background:#fff;
    border:1px solid var(--line);padding:0 12px;box-shadow:var(--sh-sm)}
  .fld input{flex:1;border:0;outline:0;background:none;font-size:11px;color:var(--ink)}
  .fld .ph{color:var(--ink-soft);flex:1;font-size:11px}
  .hgrid{display:flex;gap:9px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
  .hgrid::-webkit-scrollbar{display:none}
  .hcard{flex:0 0 148px;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm)}
  .hcard .thumb{height:64px;background:linear-gradient(135deg,#eaeaea,#d7d7d7);position:relative;display:grid;place-items:center;font-size:24px}
  .hcard .thumb.unclaimed{background:repeating-linear-gradient(45deg,#f0f0f0 0 6px,#e2e2e2 6px 12px)}
  .hcard .thumb.person{background:linear-gradient(135deg,#e9eef0,#d3dade)}
  .hcard .thumb .vmark{position:absolute;top:7px;right:7px;width:13px;height:13px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 2px #fff}
  .hcard .thumb .promo{position:absolute;top:7px;left:7px;background:var(--accent);color:#fff;font-size:7.5px;
    font-weight:800;padding:2px 6px;border-radius:999px}
  .hcard .body{padding:8px}.hcard .body b{font-size:9px;display:block}
  .hcard .body small{font-size:7.5px;color:var(--ink-soft);display:block;margin-top:2px}
  .hcard .body .pr{font-size:10px;font-weight:800;margin-top:4px;display:block}
  .old{font-size:7.5px;color:var(--ink-soft);text-decoration:line-through;margin-left:4px;font-weight:600}
  .stepline{display:flex;gap:4px;margin-top:10px}
  .stepline i{flex:1;height:4px;border-radius:3px;background:var(--line)}
  .stepline i.on{background:var(--ink)}.stepline i.trust{background:var(--accent)}
  .steplabels{display:flex;justify-content:space-between;font-size:7.5px;font-weight:700;color:var(--ink-soft);
    letter-spacing:.2px;margin-top:5px;text-transform:uppercase}
  .big{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .timer{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--warn);
    background:var(--warn-soft);border-radius:999px;padding:4px 9px;margin-top:7px}
  .qrcode{width:132px;height:132px;margin:12px auto 0;background:
     repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0 0/16px 16px;border:7px solid #fff;outline:1px solid var(--line);border-radius:10px}
  .cam{border:1px dashed var(--ink-soft);border-radius:14px;margin-top:10px;height:120px;display:grid;place-items:center;
    color:var(--ink-soft);font-size:10.5px}
  .toast{position:absolute;z-index:80;top:52px;left:14px;right:14px;background:var(--ink);color:#fff;border-radius:13px;
    padding:10px 12px;font-size:10px;font-weight:700;box-shadow:var(--sh-md);transition:transform .3s,opacity .3s}
  .toast.hidden{transform:translateY(-14px);opacity:0;pointer-events:none}
  .chatrow{font-size:10.5px;padding:7px 9px;border-radius:12px;background:var(--panel);margin-top:6px}
  .chatrow.me{background:var(--accent-soft);color:var(--accent);text-align:right}
  .rail{display:none}
  .deskpanel{display:none}
  .empty{text-align:center;padding:18px 8px;color:var(--ink-soft);font-size:11px}
  .empty .ic{font-size:26px;display:block;margin-bottom:7px}

  /* ---------- DESKTOP (>=1040px) : rail gauche, panneau de contenu, sheets = tiroirs droits ---------- */
  @media (min-width:1040px){
    body{background:#dadad7}
    .stage{max-width:1180px;height:100%;margin:0 auto;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)}
    .rail{display:flex;position:absolute;z-index:60;left:14px;top:64px;bottom:14px;width:52px;flex-direction:column;
      align-items:center;gap:6px;padding:8px;border-radius:999px;background:var(--pill);box-shadow:var(--sh-lg)}
    .rail button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.78)}
    .rail button.active{color:#fff;background:rgba(255,255,255,.18)}
    .rail svg{width:18px;height:18px}
    .rail .center{width:44px;height:44px;border:1px solid rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;border-radius:50%}
    .navpill{display:none}
    .rolepill{top:10px}
    .mapbase{left:82px}
    .countmark{left:calc(82px + 50%)}
    .filterrail{left:calc(82px + 12px)}
    .sheet{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;border-radius:0;border-top:0;
      border-left:1px solid var(--line);padding:22px 18px 22px;box-shadow:-14px 0 44px rgba(15,15,15,.10);
      animation:drawerIn .3s cubic-bezier(.23,1,.32,1)}
    @keyframes drawerIn{0%{transform:translateX(18px);opacity:0}100%{transform:none;opacity:1}}
    .handle{display:none}
    .sheet h1{font-size:20px}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mapbase"><div class="land a"></div><div class="land b"></div><div class="grid"></div><div id="pins"></div>
    <div class="countmark" id="countmark">206<small>OFFRES</small></div>
    <div class="mapctrl"><button onclick="zoom(1)">+</button><button onclick="zoom(-1)">−</button><button onclick="centerMe()">◎</button></div>
    <div class="filterrail" id="filterrail"></div>
    <div class="usermarker" style="left:48%;top:62%"></div>
  </div>
  <div class="rolepill" id="rolepill"></div>
  <div class="rail" id="rail"></div>
  <div class="navpill" id="navpill"></div>
  <div id="sheetmount"></div>
  <div class="toast hidden" id="toast"></div>
</div>
<script>
/* ===== Omni Species V2 — prototype interactif ===== */
const S = {
  role: 'buyer',
  sheet: 'search',
  prev: [],
  constraints: { rayon: '1 km', ouvert: true, budget: true },
  product: { name: 'Spaghetti 500 g', price: '850 F', old: '1 000 F', promo: '−15 % Omni', seller: 'Boutique Kodjo', kind: 'commerce', dist: '140 m' },
  entity: null,
  hasEntity: false,
  txn: null,
  step: 0,
  zoom: 1,
};

function go(sheet, opts = {}) {
  if (S.sheet !== sheet) S.prev.push(S.sheet);
  S.sheet = sheet;
  if (opts.toast) toast(opts.toast);
  render();
}
function back() { S.sheet = S.prev.pop() || (S.role === 'buyer' ? 'search' : S.role === 'seller' ? 'seller-dash' : 'admin-console'); render(); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}
function setRole(r) {
  S.role = r; S.prev = [];
  S.sheet = r === 'buyer' ? 'search'
    : r === 'seller' ? (S.hasEntity ? 'seller-dash' : 'seller-entry')
    : r === 'operator' ? 'op-queue'
    : 'admin-console';
  render();
}
function zoom(d) { S.zoom = Math.max(0.6, Math.min(2.4, S.zoom + d * 0.2)); document.getElementById('mapbase'); render(); }
function centerMe() { toast('Recentré sur votre position'); }

const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3h-3zM20 20h.01"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  shop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/></svg>',
  console: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10h8M8 14h5"/></svg>',
};

function dockFor() {
  if (S.role === 'buyer') return [
    { ic: ICON.search, sheet: 'search', label: 'Recherche' },
    { ic: ICON.qr, sheet: 'scan-entity', label: 'Scanner le QR d’une entité', center: true },
    { ic: ICON.menu, sheet: 'menu', label: 'Menu' },
  ];
  if (S.role === 'seller') return [
    { ic: ICON.shop, sheet: S.hasEntity ? 'seller-dash' : 'seller-entry', label: 'Mon espace' },
    { ic: ICON.qr, sheet: 'seller-scan', label: 'Scanner le code d’un acheteur', center: true },
    { ic: ICON.menu, sheet: 'menu', label: 'Menu' },
  ];
  if (S.role === 'operator') return [
    { ic: ICON.pin, sheet: 'op-queue', label: 'Dossier terrain' },
    { ic: ICON.console, sheet: 'op-side', label: 'Aperçu côté entité', center: true },
    { ic: ICON.menu, sheet: 'menu', label: 'Menu' },
  ];
  return [
    { ic: ICON.console, sheet: 'admin-console', label: 'Console' },
    { ic: ICON.pin, sheet: 'admin-review', label: 'Revue des pins', center: true },
    { ic: ICON.menu, sheet: 'menu', label: 'Menu' },
  ];
}

function renderRolePill() {
  const roles = [['buyer', 'Acheteur'], ['seller', 'Vendeur'], ['operator', 'Opérateur'], ['admin', 'Admin']];
  document.getElementById('rolepill').innerHTML = roles.map(([id, lb]) =>
    `<button class="${S.role === id ? 'on' : ''}" onclick="setRole('${id}')">${lb}</button>`).join('');
}
function renderDock(el, vertical) {
  document.getElementById(el).innerHTML = dockFor().map(it =>
    `<button class="${S.sheet === it.sheet ? 'active' : ''} ${it.center && !vertical ? 'center' : ''} ${it.center && vertical ? 'center' : ''}" title="${it.label}" onclick="go('${it.sheet}')">${it.ic}</button>`).join('');
}
function renderPins() {
  if (S.role === 'admin' || S.role === 'operator') {
    document.getElementById('pins').innerHTML =
      '<span class="vdot unclaimed" style="left:34%;top:38%" onclick="go(\'admin-review\')"></span>' +
      '<span class="vdot unclaimed" style="left:60%;top:44%" onclick="go(\'admin-review\')"></span>';
    return;
  }
  const pins = S.sheet === 'search' || S.sheet === 'scan-entity'
    ? '<span class="vdot" style="left:34%;top:40%;transform:scale(' + S.zoom + ')" onclick="openOffer(\'commerce\')"></span>' +
      '<span class="vdot ink" style="left:62%;top:36%;transform:scale(' + S.zoom + ')" onclick="openOffer(\'person\')"></span>' +
      '<span class="vdot unclaimed" style="left:24%;top:56%;transform:scale(' + S.zoom + ')" onclick="toast(\'Lieu connu — non revendiqué\')"></span>'
    : '<span class="vdot ink" style="left:48%;top:42%" onclick="openOffer(\'commerce\')"></span>';
  document.getElementById('pins').innerHTML = pins;
  document.getElementById('countmark').style.display = (S.sheet === 'search') ? '' : 'none';
}
function renderFilters() {
  const show = S.role === 'buyer' && (S.sheet === 'search' || S.sheet === 'scan-entity' || S.sheet === 'results');
  const f = document.getElementById('filterrail');
  if (!show) { f.innerHTML = ''; return; }
  f.innerHTML = ['Tout', 'Commerces', 'Particuliers', 'Transport'].map((x, i) =>
    `<span class="fchip ${i === 0 ? 'on' : (x === 'Transport' ? 'soon' : '')}" onclick="toast('${x === 'Transport' ? 'Transport — bientôt (V1+)' : 'Filtre ' + x}')">${x}</span>`).join('');
}

function openOffer(kind) {
  S.product = kind === 'person'
    ? { name: 'Ordinateur Dell (occasion)', price: '45 000 F', old: '50 000 F', promo: '−10 % Omni', seller: 'Awa T.', kind: 'particulier', dist: '380 m' }
    : { name: 'Spaghetti 500 g', price: '850 F', old: '1 000 F', promo: '−15 % Omni', seller: 'Boutique Kodjo', kind: 'commerce', dist: '140 m' };
  go('offer');
}

/* ---------- SHEETS : acheteur ---------- */
const SHEETS = {};

SHEETS.search = () => `
  <div class="handle"></div>
  <div class="sheet-head"><div><div class="eyebrow">Recherche</div><h1>Que cherchez-vous ?</h1></div></div>
  <div style="margin-top:9px"><div class="fld">${ICON.search}<input placeholder="Produit, service, propriété…" onkeydown="if(event.key==='Enter')doSearch()" id="q"></div></div>
  <div class="eyebrow" style="margin-top:11px">Contraintes (requête, pas engagement vendeur)</div>
  <div class="chips">
    <span class="chip on">≤ 1 km</span><span class="chip on">Ouvert maintenant</span><span class="chip on">≤ 2 000 F</span>
    <span class="chip soon" onclick="toast('Créneau — bientôt (V1+)')">Créneau</span>
    <span class="chip soon" onclick="toast('Livraison — bientôt (V1+)')">Livraison</span>
  </div>
  <button class="btn" onclick="doSearch()">Rechercher</button>
  <div class="cardbox"><div class="kv"><span>Démonstration</span><b>Aucun résultat · Réseau lent · Panne</b></div></div>
  <div class="chips">
    <span class="chip" onclick="go('results-empty')">Aucun résultat</span>
    <span class="chip" onclick="go('state-slow')">Réseau lent</span>
    <span class="chip" onclick="go('state-error')">Panne réseau</span>
  </div>`;

SHEETS.results = () => `
  <div class="handle"></div>
  <div class="sheet-head"><div><div class="eyebrow">Résultats · correspondant à vos contraintes</div><h1>3 offres</h1></div><span class="status gray">3</span></div>
  <div class="hgrid">
    <div class="hcard" onclick="openOffer('commerce')"><div class="thumb">🍝<span class="vmark"></span><span class="promo">−15 % Omni</span></div><div class="body"><b>Spaghetti 500 g</b><small>Boutique Kodjo · commerce · 140 m</small><span class="pr">850 F<span class="old">1 000 F</span></span><span class="status ok" style="margin-top:5px">En stock</span></div></div>
    <div class="hcard" onclick="openOffer('person')"><div class="thumb person">💻</div><div class="body"><b>Ordinateur Dell</b><small>Awa T. · particulier · 380 m</small><span class="pr">45 000 F<span class="old">50 000 F</span></span><span class="status dash" style="margin-top:5px">À confirmer</span></div></div>
