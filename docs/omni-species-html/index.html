<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Omni — World Layer Species Prototype</title>
<style>
:root{--ink:#0b1712;--muted:#6f7b75;--line:#e6ebe7;--paper:#f4f7f4;--panel:#fff;--green:#10a96b;--green-dark:#08794d;--mint:#e4f8ef;--amber:#c88915;--red:#c64d4d;--shadow:0 24px 70px #14251d1c;--r:26px;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0%,#ffffff 0 28%,#e9efeb 78%)}button,input,select{font:inherit}button{cursor:pointer;border:0}.prototype{min-height:100vh;display:grid;place-items:center;padding:30px}.phone{width:min(430px,100%);height:min(900px,calc(100vh - 40px));min-height:680px;background:var(--paper);border:8px solid #121716;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 35px 100px #0e171244}.screen{height:100%;overflow:auto;position:relative;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.top{position:absolute;z-index:5;top:18px;left:22px;right:22px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:26px;font-weight:850;letter-spacing:-1.5px}.top-actions{display:flex;gap:8px}.icon-btn,.ghost-icon{width:42px;height:42px;border-radius:50%;background:#ffffffd9;border:1px solid #ffffff;display:grid;place-items:center;font-size:18px;box-shadow:0 6px 20px #18251c12}.map{height:66%;min-height:480px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#ffffff 0 7%,transparent 31%),radial-gradient(ellipse at 46% 70%,#d6e5dc 0 18%,transparent 52%),linear-gradient(145deg,#d6e2da 0%,#f7faf7 48%,#d7e3dc 100%)}.map:before{content:"";position:absolute;inset:-15%;opacity:.68;background:repeating-linear-gradient(28deg,transparent 0 38px,#cbd7cf 39px 40px),repeating-linear-gradient(118deg,transparent 0 58px,#d5ded8 59px 60px);transform:rotate(-4deg);filter:blur(.15px)}.map:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 54%,transparent 0 31%,#ffffff90 68%),linear-gradient(180deg,#ffffff38 0%,transparent 42%,#cbdad155 100%);pointer-events:none}.continent{position:absolute;inset:80px 16px 0;z-index:1;opacity:.52;filter:drop-shadow(0 18px 28px #78998922);background:linear-gradient(24deg,transparent 0 23%,#c9d8ce 24% 26%,transparent 27% 100%),linear-gradient(112deg,transparent 0 40%,#c9d8ce 41% 42%,transparent 43% 100%);clip-path:polygon(8% 2%,30% 0,47% 12%,63% 8%,84% 23%,100% 32%,89% 51%,94% 72%,72% 68%,57% 94%,32% 78%,19% 100%,3% 68%,12% 44%,0 26%)}.map-label{position:absolute;z-index:2;top:150px;left:42px;text-transform:uppercase;letter-spacing:2px;font-size:10px;color:#708078;background:#ffffff80;padding:7px 9px;border-radius:999px;backdrop-filter:blur(8px)}.map-title{position:absolute;z-index:2;top:198px;left:0;right:0;text-align:center;font-size:34px;letter-spacing:-1.5px;font-weight:850;text-shadow:0 2px 12px #ffffffaa}.pin{position:absolute;z-index:3;width:17px;height:17px;border-radius:50% 50% 50% 0;background:#fff;border:5px solid var(--green);transform:rotate(-45deg);box-shadow:0 0 0 8px #16a66a1d,0 8px 18px #11281a28}.pin i{display:none}.p1{top:39%;left:31%}.p2{top:46%;left:66%;border-color:#c7a95a;box-shadow:0 0 0 7px #c7a95a22}.p3{top:57%;left:48%}.p4{top:32%;left:75%;border-color:#c7a95a}.you{position:absolute;z-index:4;top:52%;left:52%;width:24px;height:24px;border-radius:50%;background:var(--green);border:6px solid #fff;box-shadow:0 0 0 12px #16a66a26,0 5px 20px #13291e33}.hud{position:absolute;z-index:4;left:18px;right:18px;bottom:16px;display:flex;gap:10px}.search{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 14px 36px #10261a22;border-radius:22px;min-height:66px;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 18px;flex:1;border:1px solid #ffffff}.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px;color:var(--ink)}.search input::placeholder{color:#7d8681}.round-action{width:48px;height:48px;border-radius:15px;background:var(--green);color:#fff;font-size:21px}.explore{width:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 14px 36px #10261a1d;display:grid;place-items:center;font-size:11px;font-weight:800}.explore b{font-size:21px;line-height:1}.sheet{background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-radius:32px 32px 0 0;min-height:35%;padding:24px 20px 28px;position:relative;z-index:6;box-shadow:0 -20px 55px #14241a18}.handle{width:42px;height:5px;background:#d7ddda;border-radius:5px;margin:0 auto 22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--green-dark)}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.02;letter-spacing:-1.8px}h2{font-size:23px;letter-spacing:-.8px}h3{font-size:16px}.sub{color:var(--muted);line-height:1.45;margin-top:10px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:9px 12px;border-radius:999px;background:#f1f4f2;color:#59625e;font-size:12px;font-weight:700}.chip.active{background:var(--mint);color:var(--green-dark)}.card{background:rgba(255,255,255,.96);border:1px solid #e4ebe6;border-radius:22px;padding:17px;margin-top:12px;box-shadow:0 8px 24px #1b30241a}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}.tiny{font-size:12px}.price{font-size:22px;font-weight:850}.status{display:inline-flex;align-items:center;gap:6px;color:var(--green-dark);background:var(--mint);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.status.amber{color:#8a5c0a;background:#fff4d8}.btn{width:100%;min-height:54px;border-radius:17px;padding:14px 16px;font-weight:800;letter-spacing:-.1px;transition:.16s var(--ease);margin-top:12px}.btn:active{transform:scale(.97)}.primary{color:#fff;background:var(--green)}.secondary{color:var(--ink);background:#f0f3f1}.outline{color:var(--green-dark);background:#fff;border:1px solid #9ad8bc}.link-btn{background:transparent;color:var(--green-dark);font-weight:800;padding:8px 0}.bottom-nav{position:sticky;bottom:0;background:#ffffffeb;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px 12px;z-index:10}.nav-item{background:none;color:#7d8581;font-size:10px;font-weight:700;display:grid;gap:3px;justify-items:center}.nav-item.active{color:var(--green-dark)}.nav-item span:first-child{font-size:20px}.page{min-height:100%;padding:28px 20px 30px;background:var(--paper)}.page .back{margin-bottom:22px;background:none;font-weight:800}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.input{height:54px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 15px;outline:0;width:100%;font-size:15px}.stack{display:grid;gap:12px}.progress{height:8px;border-radius:9px;background:#e8eeeb;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:9px}.qr{width:180px;height:180px;margin:12px auto 18px;background:repeating-conic-gradient(#111 0 8%,#fff 0 16%);border:14px solid #fff;outline:1px solid #dce3de}.timeline{display:grid;gap:0}.step{display:flex;gap:12px;position:relative;padding:10px 0}.step:before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid #b8c5bd;flex:none;background:#fff;z-index:1}.step.done:before{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 4px #fff}.step:after{content:"";position:absolute;left:9px;top:29px;height:27px;border-left:2px dashed #ccd6d0}.step:last-child:after{display:none}.step strong{font-size:14px}.step small{display:block;color:var(--muted);margin-top:3px}.modal-back{position:absolute;inset:0;background:#111a;z-index:20;display:grid;align-items:end}.modal{background:#fff;border-radius:28px 28px 0 0;padding:25px 20px 26px}.modal .handle{margin-bottom:20px}.toast{position:absolute;z-index:30;top:18px;left:18px;right:18px;background:#101715;color:#fff;border-radius:16px;padding:13px 15px;font-size:12px;box-shadow:var(--shadow)}.hidden{display:none!important}.role-pill{font-size:11px;background:#111;color:#fff;border-radius:999px;padding:7px 10px;font-weight:800}.menu-list{display:grid;gap:4px;margin:18px 0}.menu-item{background:#f4f6f4;border-radius:15px;padding:15px;display:flex;align-items:center;justify-content:space-between;font-weight:750}.danger{color:var(--red)}.section{margin-top:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.metric b{font-size:23px;display:block;margin-top:5px}.map-mini{height:145px;border-radius:18px;background:linear-gradient(130deg,#dce8df,#f5f8f5);position:relative;overflow:hidden}.map-mini:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(30deg,transparent 0 28px,#c9d9ce 29px 30px),repeating-linear-gradient(120deg,transparent 0 42px,#d1ddd5 43px 44px)}.map-mini .pin{top:48%;left:49%}
@media(max-width:520px){.prototype{padding:0}.phone{width:100%;height:100vh;min-height:100vh;border:0;border-radius:0}.map{height:65%}}
</style></head>
<body>
<div class="prototype"><div class="phone"><main id="app" class="screen"></main></div></div>
<script>fetch('app.js?v=boot').then(r=>r.text()).then(code=>{try{(0,eval)(code)}catch(e){document.querySelector('#app').innerHTML='<section class="page"><h1>Prototype error</h1><p>'+e.message+'</p></section>'}})</script>
